name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be 2.x: poetry.lock is written with lock-version 2.1, which Poetry 1.x
  # cannot read.
  POETRY_VERSION: "2.1.3"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with lint,typing

      - name: Check formatting
        run: poetry run ruff format . --diff

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy langchain_oxylabs

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with test

      - name: Check imports
        run: make check_imports

      # --disable-socket makes an accidental network call a test failure rather
      # than a slow, flaky pass.
      - name: Run unit tests
        run: make test

  compatibility:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # We support both the langchain-core 0.3 series and LangChain v1.
        # Exercising both bounds means a future core release cannot silently
        # strand us the way core 1.0 did.
        include:
          - label: "langchain-core 0.3 (lower bound)"
            spec: "langchain-core>=0.3.72,<0.4.0"
          - label: "langchain-core 1.x (current)"
            spec: "langchain-core>=1.0,<2.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with test

      - name: Force langchain-core version under test
        run: poetry run pip install "${{ matrix.spec }}"

      - name: Report resolved versions
        run: |
          poetry run python -c "import importlib.metadata as m; \
            print('langchain-core:', m.version('langchain-core')); \
            print('oxylabs:', m.version('oxylabs'))"

      - name: Unit tests against this core
        run: poetry run pytest --disable-socket --allow-unix-socket tests/unit_tests/
