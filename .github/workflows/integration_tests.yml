name: Integration tests

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Catches upstream langchain-core and Oxylabs API
    # changes before users report them.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: integration-tests
  cancel-in-progress: false

env:
  # Must be 2.x: poetry.lock is written with lock-version 2.1, which Poetry 1.x
  # cannot read.
  POETRY_VERSION: "2.1.3"

jobs:
  integration-tests:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Live API calls are slow; the slowest single test has been observed at ~90s.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with test,test_integration

      - name: Run integration tests
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: poetry run pytest tests/integration_tests/ -v --durations=10
