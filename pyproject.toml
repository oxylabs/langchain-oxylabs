[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-oxylabs"
version = "0.3.0"
description = "Oxylabs integration package for LangChain"
authors = []
readme = "README.md"
repository = "https://github.com/oxylabs/langchain-oxylabs"
license = "MIT"

[tool.mypy]
disallow_untyped_defs = "True"

[tool.poetry.urls]
"Source Code" = "https://github.com/oxylabs/langchain-oxylabs"
"Release Notes" = "https://github.com/oxylabs/langchain-oxylabs/releases"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-core = ">=0.3.72,<2.0.0"
oxylabs = ">=2.0.0,<4.0.0"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.test.dependencies]
# Upper bounds track what langchain-tests allows, so security updates to the
# test toolchain are not blocked by our own pins.
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=1.4,<2.0"
pytest-socket = "^0.7.0"
pytest-watcher = "^0.3.4"
langchain-tests = "^1.1"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint.dependencies]
ruff = "^0.5"

[tool.poetry.group.typing.dependencies]
mypy = "^1.10"
